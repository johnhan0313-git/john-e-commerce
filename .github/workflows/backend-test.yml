name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - "scripts/sql/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/sql/**"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B test
        # Testcontainers needs Docker (available on GitHub-hosted runners).
        # Coverage goal: golden-path integration + pure-rule unit tests — not line % thresholds.
