server:
  port: 8020
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/john-ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:john-ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:john-ecommerce-123}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:16379}
      database: ${SPRING_REDIS_DATABASE:6}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      table-prefix: t_
      logic-delete-field: delete_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expire-ms: 604800000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:19000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:john-ecommerce}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3020,http://localhost:3021}

logging:
  level:
    com.john.ecommerce: ${LOG_LEVEL:DEBUG}
