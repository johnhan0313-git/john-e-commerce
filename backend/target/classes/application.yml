server:
  port: 8020
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:15432/john-ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:john-ecommerce}
    password: ${SPRING_DATASOURCE_PASSWORD:john-ecommerce-123}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Allow JacksonTypeHandler JSON strings to bind into jsonb columns
        stringtype: unspecified

  data:
    redis:
      host: ${SPRING_REDIS_HOST:127.0.0.1}
      port: ${SPRING_REDIS_PORT:16379}
      database: ${SPRING_REDIS_DATABASE:6}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      table-prefix: t_
      logic-delete-field: delete_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:john-ecommerce-dev-jwt-secret-change-me-32b+}
    expire-ms: 604800000
  auth:
    code-ttl-seconds: ${AUTH_CODE_TTL_SECONDS:300}
    # 本地/CI 默认固定验证码；生产请设 AUTH_FIXED_CODE= 清空以启用随机码
    fixed-code: ${AUTH_FIXED_CODE:123456}
    # 买家/卖家首次登录自动注册时使用的默认租户（也可由请求头 X-Tenant-Id 覆盖）
    default-tenant-id: ${AUTH_DEFAULT_TENANT_ID:1}
  # SMTP 与 john-ip-studio 同名环境变量；默认 163 SSL:465
  mail:
    host: ${SMTP_HOST:smtp.163.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:yulei_han@163.com}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:yulei_han@163.com}
    use-tls: ${SMTP_USE_TLS:false}
    use-ssl: ${SMTP_USE_SSL:true}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:19000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:john-ecommerce}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://127.0.0.1:19000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3022,http://localhost:3021,http://localhost:3023}
  trade:
    pay-timeout-ms: ${TRADE_PAY_TIMEOUT_MS:1800000}
    unpaid-cancel-delay-ms: ${TRADE_UNPAID_CANCEL_DELAY_MS:60000}

logging:
  level:
    com.john.ecommerce: ${LOG_LEVEL:DEBUG}
