server:
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    default-property-inclusion: non_null

# Defaults when Docker/Testcontainers unavailable — local john-server ports
  datasource:
    url: jdbc:postgresql://127.0.0.1:15432/john-ecommerce
    username: john-ecommerce
    password: john-ecommerce-123
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        stringtype: unspecified
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      database: 15

logging:
  level:
    com.john.ecommerce: INFO
    org.testcontainers: INFO

app:
  jwt:
    secret: john-ecommerce-test-jwt-secret-change-me-32b+
    expire-ms: 3600000
  auth:
    code-ttl-seconds: 300
    fixed-code: "123456"
  # 测试不走真实 SMTP，由 LoggingEmailSender 承接
  mail:
    host: ""
  minio:
    endpoint: http://127.0.0.1:19000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: john-ecommerce-test
    public-base-url: http://127.0.0.1:19000
  cors:
    origins: http://localhost:3022,http://localhost:3021,http://localhost:3023
  trade:
    pay-timeout-ms: 1800000
    unpaid-cancel-delay-ms: 3600000
