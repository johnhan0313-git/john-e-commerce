# john-e-commerce — 商城 C 端 + 管理端
# 追加到 john-server 的 /home/john-han/mydocker/mntdata/nginx/nginx.conf http{} 内
#   mall.cool-app.me    C 端商城
#   eadmin.cool-app.me  管理后台
# /api 同源反代到 backend,前端免 CORS。

server {
    listen 80;
    server_name mall.cool-app.me;

    client_max_body_size 20m;

    location /api/ {
        set $jec_backend http://john-e-commerce-backend-1:8020;
        proxy_pass $jec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        set $jec_mall http://john-e-commerce-mall-1:80;
        proxy_pass $jec_mall;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name eadmin.cool-app.me;

    client_max_body_size 20m;

    location /api/ {
        set $jec_backend http://john-e-commerce-backend-1:8020;
        proxy_pass $jec_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        set $jec_admin http://john-e-commerce-admin-1:80;
        proxy_pass $jec_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
